name: omborchi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omborchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-omborchi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-omborchi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omborchi}
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
    ports:
      - '${APP_PORT:-8080}:3000'
    restart: unless-stopped

volumes:
  pgdata:
