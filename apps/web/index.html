<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0e6b73" />

        var t = localStorage.getItem('omb.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
